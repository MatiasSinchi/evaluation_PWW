<section class="hero min-h-40 from-primary to-secondary text-primary-content">
  <div class="hero-content text-center py-10">
    <div>
      <h1 class="text-4xl font-bold mb-4">{{ title() }}</h1>
      @if (loading()) {
        <div class="flex items-center justify-center gap-3">
          <span class="loading loading-spinner loading-md"></span>
          <span class="text-lg">Cargando personajes...</span>
        </div>
      } @else if (!totalValid) {
        <p class="text-2xl font-semibold text-error bg-error/20 px-4 py-2 rounded-lg">
          ERROR 
        </p>
      } @else {
        <p class="text-xl">
          Total: <span class="font-bold">{{ total() }}</span> personajes
        </p>
      }
    </div>
  </div>
</section>
